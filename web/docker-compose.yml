# โปรเจกต์ Docker เว็บ: ruamkan-web (ต่อ ruamkan-db ผ่าน network ruamkan-net · เปิด db ก่อนเสมอ)
name: ruamkan-web
services:
  ruamkan-web:
    build:
      context: .
    image: ruamkan-web:latest
    container_name: ruamkan-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://ruamkan:ruamkan_dev_pw@ruamkan-db:5432/ruamkan
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      TZ: Asia/Bangkok
      BUG_MODE: "${BUG_MODE:-0}"
      ALLOW_TEST_RESET: "${ALLOW_TEST_RESET:-1}"
      SESSION_SECRET: "ruamkan-dev-session-secret"
      DATA_KEY: "ruamkan-dev-key"
      STORAGE_DIR: /app/storage
    volumes:
      - ruamkan-uploads:/app/storage
    networks:
      - ruamkan-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>r.json()).then(j=>process.exit(j.ok&&j.db?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
volumes:
  ruamkan-uploads:
    name: ruamkan-uploads
networks:
  ruamkan-net:
    external: true
    name: ruamkan-net
